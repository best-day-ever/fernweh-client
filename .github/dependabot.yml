# Product updates only. Packaging/qualification is owned by instinctual/plank.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Keep PLANK native-input history; the generic default branch is incompatible.
    ignore:
      - dependency-name: moonlight-common-c/moonlight-common-c
    commit-message:
      prefix: deps
